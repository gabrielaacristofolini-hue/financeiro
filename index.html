<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Meus Gastos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Cpath d='M16 16V2a14 14 0 0 1 13.3 18.3z' fill='%23eb6834'/%3E%3Cpath d='M16 16l13.3 4.3A14 14 0 0 1 16 30z' fill='%231baf7a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- ?v= muda a cada atualização para o navegador nunca misturar arquivos novos com antigos do cache -->
  <link rel="stylesheet" href="css/estilo.css?v=20261125-4">
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <div>
        <p class="sobretitulo" id="sobretitulo">Gastos do mês</p>
        <h1>Meus Gastos</h1>
        <p class="subtitulo" id="periodo">Carregando…</p>
      </div>
      <label class="mes">
        <span>Mês</span>
        <strong id="mesTexto">—</strong>
        <select id="selMes" aria-label="Escolher mês" hidden></select>
      </label>
    </header>

    <section class="kpis" aria-label="Resumo" id="kpis"></section>

    <section class="cartao">
      <header class="cartao-topo">
        <div>
          <h2>Para onde foi o dinheiro</h2>
          <p class="cartao-sub">Toque numa fatia ou numa categoria para ver só os lançamentos dela</p>
        </div>
      </header>
      <div class="divisao">
        <div class="pizza" id="pizza"></div>
        <table class="categorias">
          <thead><tr><th>Categoria</th><th class="col-barra" aria-hidden="true"></th><th class="num">Valor</th><th class="num">%</th></tr></thead>
          <tbody id="categorias"></tbody>
          <tfoot id="categoriasTotal"></tfoot>
        </table>
      </div>
    </section>

    <section class="cartao">
      <header class="cartao-topo">
        <div>
          <h2>Gastos por dia</h2>
          <p class="cartao-sub" id="subDias"></p>
        </div>
      </header>
      <div class="dias" id="dias"></div>
    </section>

    <section class="cartao">
      <header class="cartao-topo">
        <div>
          <h2>Lançamentos</h2>
          <p class="cartao-sub" id="subLanc"></p>
        </div>
        <div class="filtro" id="filtro" hidden></div>
      </header>
      <div class="lancamentos" id="lancamentos"></div>
    </section>

    <footer class="rodape" id="rodape"></footer>
  </div>

  <div class="dica" id="dica" hidden></div>

  <div class="aviso-erro" id="avisoErro" hidden>
    <strong>Não foi possível montar a página.</strong>
    Recarregue com <kbd>Ctrl</kbd> + <kbd>F5</kbd> (no celular, feche e abra a aba de novo).
  </div>

  <script>
    // Os dados são buscados sempre frescos (sem cache), para correções aparecerem na hora.
    // O script da página leva ?v= e só muda quando o código muda.
    // Se algo falhar, mostra o aviso em vez de deixar a página em branco.
    (function () {
      var falha = function () { document.getElementById('avisoErro').hidden = false; };
      var carregar = function (src, depois) {
        var s = document.createElement('script');
        s.src = src; s.onload = depois; s.onerror = falha;
        document.body.appendChild(s);
      };
      carregar('dados/transacoes.js?t=' + Date.now(), function () {
        carregar('js/app.js?v=20261125-4', function () { if (!window.PAINEL_OK) falha(); });
      });
    })();
  </script>
</body>
</html>
